version: '3.8'

services:
  api:
    build: .
    ports:
      - "8071:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://sysuser:syspassword@db:5432/sys?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sysuser
      POSTGRES_PASSWORD: syspassword
      POSTGRES_DB: sys
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
