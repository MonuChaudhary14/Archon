basePath: /
definitions:
  github_com_MonuChaudhary14_Archon_pkg_response.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  internal_auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 30
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.ResendOTPRequest:
    properties:
      email:
        type: string
      intent:
        enum:
        - register
        - forgot_password
        type: string
    required:
    - email
    - intent
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 30
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  internal_auth.VerifyEmailRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  internal_auth.VerifyResetOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  internal_auth.VerifyResetOTPResponse:
    properties:
      reset_token:
        type: string
    type: object
  internal_diagram.DiagramResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/internal_diagram.Edge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/internal_diagram.Node'
        type: array
    type: object
  internal_diagram.Edge:
    properties:
      id:
        type: string
      interview_id:
        type: string
      source:
        type: string
      target:
        type: string
      type:
        type: string
    type: object
  internal_diagram.Node:
    properties:
      id:
        type: string
      interview_id:
        type: string
      label:
        type: string
      type:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  internal_interview.CreateInterviewRequest:
    properties:
      difficulty:
        enum:
        - Beginner
        - Intermediate
        - Senior
        - Staff
        example: Senior
        type: string
      question_id:
        example: 8d2f6c90-9c12-4266-a456-426614174000
        type: string
    required:
    - difficulty
    type: object
  internal_interview.Interview:
    properties:
      deleted_at:
        type: string
      ended_at:
        type: string
      feedback:
        items:
          type: integer
        type: array
      id:
        type: string
      question_id:
        type: string
      score:
        type: integer
      started_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_interview.Question:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      difficulty:
        type: string
      expected_topics:
        items:
          type: string
        type: array
      id:
        type: string
      time_limit_minutes:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  internal_interview.StartInterviewResponse:
    properties:
      question:
        $ref: '#/definitions/internal_interview.Question'
      session_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the Sys API server.
  title: Sys API
  version: "1.0"
paths:
  /ai/chat:
    get:
      description: Establishes a bidirectional WebSocket connection to stream chat
        messages and diagram events for a specific interview session.
      parameters:
      - description: Interview Session ID
        in: query
        name: session_id
        required: true
        type: string
      responses: {}
      summary: Connect to AI Chat WebSocket session
      tags:
      - ai
  /api/v1/interviews:
    get:
      description: Retrieves all past and current system design interview sessions
        for the user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_interview.Interview'
            type: array
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all interviews for the authenticated user
      tags:
      - interviews
  /api/v1/interviews/{id}/diagram:
    get:
      description: Retrieves the diagram nodes and edges for a specific interview
        session.
      parameters:
      - description: Interview Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_diagram.DiagramResponse'
        "400":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get diagram state
      tags:
      - diagrams
  /api/v1/interviews/{id}/report:
    get:
      description: Retrieves the evaluation report, score, and feedback of an interview
        session by ID.
      parameters:
      - description: Interview Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interview.Interview'
        "202":
          description: '{"status": "evaluation in progress"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the report of a completed interview
      tags:
      - interviews
  /api/v1/interviews/{id}/submit:
    post:
      consumes:
      - application/json
      description: Ends the interview session and triggers the AI evaluation in the
        background.
      parameters:
      - description: Interview Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "interview submitted successfully"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Manually submit/end an interview session
      tags:
      - interviews
  /api/v1/interviews/questions:
    get:
      description: Retrieves the full list of system design interview topics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_interview.Question'
            type: array
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all available system design questions
      tags:
      - interviews
  /api/v1/interviews/start:
    post:
      consumes:
      - application/json
      description: Creates a new system design interview session and returns the initial
        question.
      parameters:
      - description: Interview Setup Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_interview.CreateInterviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interview.StartInterviewResponse'
        "400":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: '{"error": "..."}'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Start a new system design interview
      tags:
      - interviews
  /callback/{provider}:
    get:
      description: Handles the callback from the OAuth provider, exchanges the code
        for tokens, logs the user in, and redirects to the frontend dashboard.
      parameters:
      - description: OAuth Provider (google or github)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization Code from provider
        in: query
        name: code
        required: true
        type: string
      responses:
        "302":
          description: Redirect to Frontend Dashboard
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: OAuth Callback Handler
      tags:
      - auth
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset email
      parameters:
      - description: Forgot Password Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Forgot password
      tags:
      - auth
  /login:
    post:
      consumes:
      - application/json
      description: Login with email and password
      parameters:
      - description: Login Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Login user
      tags:
      - auth
  /login/{provider}:
    get:
      description: Redirects the user to the specified OAuth provider's login page
      parameters:
      - description: OAuth Provider (google or github)
        in: path
        name: provider
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect to OAuth Provider
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Initiate OAuth Login
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/json
      description: Logout user and invalidate refresh token
      parameters:
      - description: Logout Info
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh Token Info
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Refresh token
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user with name, email and password
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Register a new user
      tags:
      - auth
  /resend-otp:
    post:
      consumes:
      - application/json
      description: Resend OTP for email verification or password reset
      parameters:
      - description: Resend OTP Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Resend OTP
      tags:
      - auth
  /reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using reset token
      parameters:
      - description: Reset Password Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Reset password
      tags:
      - auth
  /verify-email:
    post:
      consumes:
      - application/json
      description: Verify email using the OTP sent to the user
      parameters:
      - description: Verify Email Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Verify email with OTP
      tags:
      - auth
  /verify-reset-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent for password reset
      parameters:
      - description: Verify Reset OTP Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyResetOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.VerifyResetOTPResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_MonuChaudhary14_Archon_pkg_response.APIResponse'
      summary: Verify reset password OTP
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
